description: Hold-tap that immediately resolves to hold if any other key is already pressed

compatible: "zmk,behavior-hold-tap-solo"

include: two_param.yaml

properties:
  bindings:
    type: phandles
    required: true
  tapping-term-ms:
    type: int
    required: true

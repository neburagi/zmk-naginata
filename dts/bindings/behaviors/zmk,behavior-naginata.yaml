description: Naginata-shiki behavior

compatible: "zmk,behavior-naginata"

include: one_param.yaml

properties:
  late-shift-window-ms:
    type: int
    default: 80
  dual-space-window-ms:
    type: int
    default: 120
    description: "late combo window for SPACE+ENTER dual-shift enter"
  kuten-confirm-enter:
    type: int
    default: 1
    description: "0=disabled, 1=enter, 2=space"
